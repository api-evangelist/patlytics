apis:
- aid: patlytics:patent-search-mcp
  name: Patlytics Patent Search (MCP)
  description: 'The Patlytics Patent Search connector — a hosted Model Context Protocol
    server (Streamable HTTP) that brings concept-level, AI-native patent intelligence into
    MCP clients such as Claude. Five read-only tools cover semantic prior-art discovery over
    patent claims, bibliographic and claims lookup by publication number, non-patent-literature
    search (papers, journals, books, via OpenAlex), and listing an organization''s private
    Patlytics portfolios and vault patents. Access is restricted to existing Patlytics users:
    each member signs in individually through Patlytics OAuth 2.1 (authorization code + PKCE
    S256, dynamic client registration) and results are scoped to their organization. Deeper
    analyses — freedom-to-operate, infringement, invalidity and drafting — run in the Patlytics
    web application, linked from every result.'
  humanURL: https://mcp.patlytics.ai/docs
