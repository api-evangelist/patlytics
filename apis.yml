aid: patlytics
name: Patlytics
description: 'Patlytics is an AI-powered patent intelligence platform purpose-built for
  intellectual-property work, applying generative AI and large language models across the
  full patent lifecycle: invention harvesting and disclosure, patent application drafting,
  office-action analysis, prior-art and novelty search, infringement detection, invalidity
  contentions, claim-chart generation, portfolio pruning, vault and classification, and
  transactional IP due diligence. Founded in 2023 and headquartered in New York, the company
  raised a $40M Series B led by SignalFire in April 2026 (roughly $65M total) and counts more
  than 40% of the Am Law 100 among its customers. Its machine-readable surface is a hosted,
  OAuth-protected Model Context Protocol server at mcp.patlytics.ai that exposes read-only
  semantic patent search, patent/claims lookup, non-patent-literature search over OpenAlex,
  and access to an organization''s private Patlytics portfolios and vault; there is no public
  REST OpenAPI, and the platform API at api.patlytics.ai is fully authentication-gated.'
