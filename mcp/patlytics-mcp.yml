server:
  name: patlytics
  title: Patlytics Patent Search
  description: Concept-level, AI-native patent intelligence inside an MCP client. Describe an invention
    in plain language and get semantically similar patents, look up a specific patent's claims, search
    academic literature, and browse your organization's private patent portfolios. All tools are read-only;
    deeper analyses (freedom-to-operate, infringement, invalidity, drafting) run in the Patlytics web
    app, linked from every result.
  transport: http
  transport_detail: Streamable HTTP
  url: https://mcp.patlytics.ai/mcp
  docs: https://mcp.patlytics.ai/docs
  audience: existing Patlytics users only; each member signs in individually and results are scoped to
    their organization
  read_only: true
